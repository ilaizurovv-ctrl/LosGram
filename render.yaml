services:
  - type: web
    name: losgram-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: losgram-db
          property: connectionString

databases:
  - name: losgram-db
    plan: free
    region: frankfurt
    databaseName: losgram_db
    user: losgram_db_user
