services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: losgram
      POSTGRES_USER: losgram
      POSTGRES_PASSWORD: losgram
    ports:
      - "5432:5432"
    volumes:
      - losgram_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U losgram -d losgram"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  losgram_pg:
